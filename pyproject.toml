[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-retrieval-engine"
version = "0.1.0"
description = "Local-first hybrid RAG retrieval engine with FastAPI, Streamlit demo UI, FAISS, and Ollama."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "faiss-cpu==1.8.0",
    "fastapi==0.111.0",
    "numpy==1.26.4",
    "pydantic==2.7.1",
    "requests==2.32.3",
    "sentence-transformers==3.0.1",
    "streamlit==1.35.0",
    "uvicorn==0.29.0",
]

[project.optional-dependencies]
dev = ["pytest==8.3.2"]

[tool.setuptools.packages.find]
where = ["src"]
